<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Explorer — Sessions (Dense List)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root[data-theme="dark"] {
    --bg: #0d1117; --surface: #161b22; --surface2: #1c2333; --surface3: #21262d;
    --border: #30363d; --text: #e6edf3; --text-muted: #8b949e;
    --user-accent: #58a6ff; --assistant-accent: #d2a8ff; --tool-accent: #7ee787;
    --thinking-accent: #f0883e; --system-accent: #f778ba;
    --row-hover: rgba(88,166,255,0.06);
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --surface: #f6f8fa; --surface2: #eef1f5; --surface3: #e8ecf0;
    --border: #d0d7de; --text: #1f2328; --text-muted: #656d76;
    --user-accent: #0969da; --assistant-accent: #8250df; --tool-accent: #1a7f37;
    --thinking-accent: #bc4c00; --system-accent: #bf3989;
    --row-hover: rgba(9,105,218,0.05);
    --shadow: 0 4px 24px rgba(0,0,0,0.1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; font-size: 13px; }

  /* ─── SIDEBAR (same as A) ─── */
  .sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  .sidebar-header { padding: 18px 16px 14px; border-bottom: 1px solid var(--border); }
  .app-logo { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  .logo-mark { width: 28px; height: 28px; background: linear-gradient(135deg, var(--user-accent), var(--assistant-accent)); border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .app-name { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; color: var(--text); line-height: 1.4; }
  .app-name small { display: block; font-size: 10px; color: var(--text-muted); font-weight: 400; }
  .path-badge { display: flex; align-items: center; gap: 5px; padding: 5px 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--text-muted); }
  .nav { flex: 1; padding: 10px 8px; overflow-y: auto; }
  .nav-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); padding: 6px 8px 4px; opacity: 0.6; }
  .nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 7px; color: var(--text-muted); cursor: pointer; transition: all 0.15s; font-size: 13px; font-weight: 500; user-select: none; border: 1px solid transparent; margin-bottom: 1px; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(88,166,255,0.12); color: var(--user-accent); border-color: rgba(88,166,255,0.2); }
  .nav-item .badge { margin-left: auto; font-size: 10px; padding: 2px 6px; border-radius: 100px; background: var(--surface2); color: var(--text-muted); font-weight: 600; border: 1px solid var(--border); }
  .nav-item.active .badge { background: rgba(88,166,255,0.15); color: var(--user-accent); border-color: rgba(88,166,255,0.25); }
  .sidebar-footer { padding: 12px 8px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
  .footer-btn { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; color: var(--text-muted); cursor: pointer; transition: all 0.15s; font-size: 12px; background: none; border: none; width: 100%; text-align: left; }
  .footer-btn:hover { background: var(--surface2); color: var(--text); }

  /* ─── MAIN ─── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  .topbar { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--bg); flex-shrink: 0; }
  .search-wrap { flex: 1; max-width: 380px; position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  .search-input { width: 100%; padding: 7px 12px 7px 34px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; outline: none; transition: border-color 0.15s; font-family: inherit; }
  .search-input:focus { border-color: var(--user-accent); }
  .search-input::placeholder { color: var(--text-muted); }
  .seg-control { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg-btn { padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--text-muted); cursor: pointer; border: none; background: none; transition: all 0.15s; }
  .seg-btn.active { background: var(--surface2); color: var(--text); }
  .select-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text-muted); font-size: 12px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .select-btn:hover { color: var(--text); border-color: var(--text-muted); }

  /* ─── TABLE ─── */
  .content { flex: 1; overflow-y: auto; }

  .table-header {
    display: grid;
    grid-template-columns: minmax(0,1fr) 160px 155px 60px 72px 80px 20px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--surface);
    z-index: 10;
  }

  .th {
    padding: 8px 8px 8px 0;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
    user-select: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0.7;
  }
  .th:hover { opacity: 1; color: var(--text); }
  .th.sorted { opacity: 1; color: var(--user-accent); }

  .project-group { }

  .project-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px 6px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 37px;
    z-index: 5;
  }

  .group-toggle {
    color: var(--text-muted);
    transition: transform 0.15s;
  }
  .group-toggle.collapsed { transform: rotate(-90deg); }

  .group-path {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--text);
    font-weight: 500;
  }

  .group-stats {
    margin-left: auto;
    display: flex;
    gap: 14px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .group-stat { display: flex; align-items: center; gap: 4px; }

  .session-row {
    display: grid;
    grid-template-columns: minmax(0,1fr) 160px 155px 60px 72px 80px 20px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
    align-items: center;
    min-height: 40px;
  }

  .session-row:hover { background: var(--row-hover); }
  .session-row:hover .row-prompt { color: var(--user-accent); }

  .row-cell {
    padding: 9px 8px 9px 0;
    display: flex;
    align-items: center;
    min-width: 0;
  }

  .row-prompt {
    font-size: 12.5px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.15s;
    font-weight: 450;
  }

  .row-project {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .model-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    white-space: nowrap;
  }
  .model-badge.opus { background: rgba(210,168,255,0.12); color: var(--assistant-accent); border: 1px solid rgba(210,168,255,0.2); }
  .model-badge.sonnet { background: rgba(88,166,255,0.1); color: var(--user-accent); border: 1px solid rgba(88,166,255,0.2); }

  .row-msgs { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-muted); }
  .row-cost { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--thinking-accent); }
  .row-time { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

  .row-star {
    background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px; opacity: 0.35;
    transition: opacity 0.15s, color 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .row-star:hover, .row-star.starred { opacity: 1; color: #f0883e; }

  .status-bar {
    padding: 6px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface);
    flex-shrink: 0;
  }
  .status-bar span { display: flex; align-items: center; gap: 5px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tool-accent); }

  @media (max-width: 768px) {
    .sidebar { width: 48px; }
    .sidebar .app-name, .sidebar .path-badge, .nav-label, .nav-item span, .sidebar-footer .footer-btn span { display: none; }
    .nav-item { justify-content: center; }
    .table-header, .session-row { grid-template-columns: minmax(0,1fr) 80px 60px; }
    .th:not(:nth-child(1)):not(:nth-child(3)):not(:nth-child(5)), .row-cell:not(:nth-child(1)):not(:nth-child(3)):not(:nth-child(5)) { display: none; }
  }
</style>
</head>
<body>
<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sidebar-header">
    <div class="app-logo">
      <div class="logo-mark">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </div>
      <div class="app-name">Claude Code Explorer <small>~/.claude</small></div>
    </div>
    <div class="path-badge">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      ~/.claude
    </div>
  </div>
  <div class="nav">
    <div class="nav-label">Navigation</div>
    <div class="nav-item active">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Sessions</span><span class="badge">47</span>
    </div>
    <div class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>Usage</span>
    </div>
    <div class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Plans</span><span class="badge">8</span>
    </div>
    <div class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      <span>Skills</span><span class="badge">12</span>
    </div>
    <div class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      <span>Commands</span><span class="badge">6</span>
    </div>
    <div class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/></svg>
      <span>Hooks</span><span class="badge">4</span>
    </div>
    <div class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>Memory</span><span class="badge">3</span>
    </div>
  </div>
  <div class="sidebar-footer">
    <button class="footer-btn" onclick="toggleTheme()">
      <svg id="theme-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <span>Toggle theme</span>
    </button>
    <button class="footer-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span>Reconnect folder</span>
    </button>
  </div>
</nav>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" placeholder="Search all sessions…">
    </div>
    <div class="seg-control">
      <button class="seg-btn">Recent</button>
      <button class="seg-btn active">By project</button>
    </div>
    <button class="select-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      Sort: Cost
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <button class="select-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      Filter
    </button>
    <div style="margin-left:auto;font-size:11px;color:var(--text-muted);white-space:nowrap">47 sessions · 4 projects</div>
  </div>

  <!-- TABLE HEADER -->
  <div class="table-header">
    <div class="th sorted">
      Prompt
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
    </div>
    <div class="th">Project</div>
    <div class="th">Model</div>
    <div class="th">Msgs</div>
    <div class="th">Cost</div>
    <div class="th">Modified</div>
    <div class="th"></div>
  </div>

  <div class="content" id="list-content">
    <!-- Rendered by JS -->
  </div>

  <div class="status-bar">
    <span><span class="status-dot"></span> ~/.claude connected</span>
    <span>47 sessions · 5 projects · est. $12.40 total</span>
    <span style="margin-left:auto">Last synced: just now</span>
  </div>
</div>

<script>
  const projects = [
    {
      path: "~/Developer/saas-platform",
      totalCost: "$6.20",
      sessions: [
        { prompt: "Refactor the authentication middleware to use JWT tokens and refresh token rotation", model: "opus", msgs: 34, cost: "$0.84", time: "2h ago", starred: true },
        { prompt: "Debug Prisma connection pool exhaustion in production — ECONNREFUSED under load", model: "sonnet", msgs: 28, cost: "$0.42", time: "5h ago", starred: false },
        { prompt: "Implement streaming SSE endpoint with real-time chat updates and backpressure handling", model: "opus", msgs: 56, cost: "$2.10", time: "3 days ago", starred: false },
        { prompt: "Optimize search index — full-text queries at 800ms, need sub-100ms performance", model: "opus", msgs: 17, cost: "$0.61", time: "5 days ago", starred: false },
        { prompt: "Add row-level security policies to Postgres for multi-tenant data isolation", model: "sonnet", msgs: 22, cost: "$0.32", time: "6 days ago", starred: false },
        { prompt: "Set up Terraform modules for staging environment on AWS ECS with auto-scaling", model: "opus", msgs: 45, cost: "$1.91", time: "1 week ago", starred: false },
      ]
    },
    {
      path: "~/Developer/claude-code-chat",
      totalCost: "$1.30",
      sessions: [
        { prompt: "Build a dark mode toggle with system preference detection and localStorage", model: "sonnet", msgs: 19, cost: "$0.18", time: "Yesterday", starred: false },
        { prompt: "Write comprehensive unit tests for the JSONL parser including edge cases", model: "opus", msgs: 41, cost: "$1.12", time: "Yesterday", starred: true },
      ]
    },
    {
      path: "~/Developer/automation",
      totalCost: "$0.62",
      sessions: [
        { prompt: "Set up n8n workflow for automated GitHub issue triage with Claude API", model: "sonnet", msgs: 22, cost: "$0.31", time: "2 days ago", starred: false },
        { prompt: "Build a Slack bot that summarizes PR reviews and posts to the team channel", model: "sonnet", msgs: 18, cost: "$0.24", time: "4 days ago", starred: false },
        { prompt: "Create daily Cron job to aggregate usage stats from Anthropic API and log to CSV", model: "sonnet", msgs: 9, cost: "$0.07", time: "5 days ago", starred: false },
      ]
    },
    {
      path: "~/Developer/legacy-app",
      totalCost: "$4.28",
      sessions: [
        { prompt: "Migrate from webpack 4 to Vite — update all config files and fix module compat", model: "opus", msgs: 63, cost: "$3.40", time: "1 week ago", starred: true },
        { prompt: "Fix broken HMR after Vite migration — React components not hot-reloading", model: "sonnet", msgs: 27, cost: "$0.88", time: "1 week ago", starred: false },
      ]
    }
  ];

  function renderList() {
    const container = document.getElementById('list-content');
    let html = '';
    projects.forEach((proj, pi) => {
      html += `
        <div class="project-group" id="group-${pi}">
          <div class="project-group-header" onclick="toggleGroup(${pi})">
            <svg class="group-toggle" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted)"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span class="group-path">${proj.path}</span>
            <div class="group-stats">
              <span class="group-stat">${proj.sessions.length} sessions</span>
              <span class="group-stat" style="color:var(--thinking-accent)">${proj.totalCost}</span>
            </div>
          </div>
          <div class="group-rows" id="rows-${pi}">
      `;
      proj.sessions.forEach((s, si) => {
        const modelClass = s.model === 'opus' ? 'opus' : 'sonnet';
        const modelLabel = s.model === 'opus' ? 'opus-4.8' : 'sonnet-4-6';
        html += `
          <div class="session-row" onclick="window.location.href='viewer.html'">
            <div class="row-cell"><span class="row-prompt">${s.prompt}</span></div>
            <div class="row-cell"><span class="row-project">${proj.path.split('/').pop()}</span></div>
            <div class="row-cell"><span class="model-badge ${modelClass}">${modelLabel}</span></div>
            <div class="row-cell"><span class="row-msgs">${s.msgs}</span></div>
            <div class="row-cell"><span class="row-cost">${s.cost}</span></div>
            <div class="row-cell"><span class="row-time">${s.time}</span></div>
            <div class="row-cell" style="justify-content:center">
              <button class="row-star ${s.starred ? 'starred' : ''}" onclick="event.stopPropagation();this.classList.toggle('starred')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="${s.starred ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              </button>
            </div>
          </div>
        `;
      });
      html += `</div></div>`;
    });
    container.innerHTML = html;
  }

  function toggleGroup(i) {
    const rows = document.getElementById('rows-' + i);
    const header = document.querySelector('#group-' + i + ' .group-toggle');
    const isHidden = rows.style.display === 'none';
    rows.style.display = isHidden ? '' : 'none';
    header.classList.toggle('collapsed', !isHidden);
  }

  renderList();

  function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('cce-theme', next);
    updateThemeIcon(next);
  }

  function updateThemeIcon(theme) {
    const icon = document.getElementById('theme-icon');
    if (theme === 'light') {
      icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    } else {
      icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
    }
  }

  const saved = localStorage.getItem('cce-theme');
  if (saved) { document.documentElement.setAttribute('data-theme', saved); updateThemeIcon(saved); }
</script>
</body>
</html>
